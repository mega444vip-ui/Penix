name: Build PENIX PROXY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf temp
          unzip -q PENIX_PROXY.zip -d temp
          cp -a temp/PENIX_PROXY/. .

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          sed -i '/android {/a\    namespace "com.penix.proxy"' app/build.gradle
          sed -i 's/minSdk[[:space:]]*[0-9]*/minSdk 24/' app/build.gradle
          sed -i '/package="com\.penix\.proxy"/s/ package="com\.penix\.proxy"//' app/src/main/AndroidManifest.xml || true
          grep -q 'dev.rikka.shizuku:api:13.1.5' app/build.gradle || sed -i '/dependencies {/a\    implementation "dev.rikka.shizuku:api:13.1.5"\n    implementation "dev.rikka.shizuku:provider:13.1.5"' app/build.gradle
          find app/src/main/java -type f -name '*.java' -print0 | while IFS= read -r -d '' f; do
            sed -i 's/import moe\.shizuku\.Shizuku;/import rikka.shizuku.Shizuku;/' "$f"
            sed -i 's/import moe\.shizuku\.ShizukuProvider;/import rikka.shizuku.ShizukuProvider;/' "$f"
            sed -i 's/import moe\.shizuku\.ShizukuBinderWrapper;/import rikka.shizuku.ShizukuBinderWrapper;/' "$f"
          done
          rm -f app/src/main/java/com/penix/proxy/FileCopyUserService.java
          rm -f app/src/main/java/com/penix/proxy/IFileCopyService.java
          rm -f app/src/main/java/com/penix/proxy/FileManager.java
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
          </FrameLayout>
          EOF
          for d in drawable drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            mkdir -p "app/src/main/res/$d"
            cp -f ic_launcher.png "app/src/main/res/$d/ic_launcher.png"
          done

      - name: Create Shizuku binder interface
        shell: bash
        run: |
          cat > app/src/main/java/com/penix/proxy/IFileCopyService.java <<'EOF'
          package com.penix.proxy;

          import android.os.Binder;
          import android.os.IBinder;
          import android.os.IInterface;
          import android.os.Parcel;
          import android.os.RemoteException;

          public interface IFileCopyService extends IInterface {
              int copyFiles(String source, String destination) throws RemoteException;

              abstract class Stub extends Binder implements IFileCopyService {
                  private static final String DESCRIPTOR = "com.penix.proxy.IFileCopyService";
                  private static final int TRANSACTION_COPY = IBinder.FIRST_CALL_TRANSACTION;
                  private static final int DESTROY_AIDL = 16777114;
                  private static final int DESTROY = 16777115;

                  public Stub() { attachInterface(this, DESCRIPTOR); }

                  public static IFileCopyService asInterface(IBinder binder) {
                      if (binder == null) return null;
                      IInterface local = binder.queryLocalInterface(DESCRIPTOR);
                      if (local instanceof IFileCopyService) return (IFileCopyService) local;
                      return new Proxy(binder);
                  }

                  @Override public IBinder asBinder() { return this; }

                  @Override protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) throws RemoteException {
                      if (code == INTERFACE_TRANSACTION) {
                          reply.writeString(DESCRIPTOR);
                          return true;
                      }
                      if (code == DESTROY_AIDL || code == DESTROY) {
                          destroy();
                          return true;
                      }
                      if (code == TRANSACTION_COPY) {
                          data.enforceInterface(DESCRIPTOR);
                          int result = copyFiles(data.readString(), data.readString());
                          reply.writeNoException();
                          reply.writeInt(result);
                          return true;
                      }
                      return super.onTransact(code, data, reply, flags);
                  }

                  private static final class Proxy implements IFileCopyService {
                      private final IBinder remote;
                      Proxy(IBinder remote) { this.remote = remote; }
                      @Override public IBinder asBinder() { return remote; }
                      @Override public int copyFiles(String source, String destination) throws RemoteException {
                          Parcel data = Parcel.obtain();
                          Parcel reply = Parcel.obtain();
                          try {
                              data.writeInterfaceToken(DESCRIPTOR);
                              data.writeString(source);
                              data.writeString(destination);
                              remote.transact(TRANSACTION_COPY, data, reply, 0);
                              reply.readException();
                              return reply.readInt();
                          } finally { reply.recycle(); data.recycle(); }
                      }
                  }
              }

              default void destroy() throws RemoteException {}
          }
          EOF

      - name: Create privileged Shizuku UserService
        shell: bash
        run: |
          cat > app/src/main/java/com/penix/proxy/FileCopyUserService.java <<'EOF'
          package com.penix.proxy;

          import android.content.Context;
          import android.os.RemoteException;
          import android.util.Log;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class FileCopyUserService extends IFileCopyService.Stub {
              private static final String TAG = "PenixFileService";

              public FileCopyUserService() { Log.i(TAG, "started"); }

              @androidx.annotation.Keep
              public FileCopyUserService(Context context) { Log.i(TAG, "started with context"); }

              @Override public int copyFiles(String source, String destination) throws RemoteException {
                  Process process = null;
                  try {
                      String qsrc = quote(source);
                      String qdst = quote(destination);
                      String command = "rm -rf " + qdst + " && mkdir -p " + qdst + " && cp -a " + qsrc + "/. " + qdst + "/";
                      Log.i(TAG, "command=" + command);
                      process = new ProcessBuilder("sh", "-c", command).redirectErrorStream(true).start();
                      BufferedReader r = new BufferedReader(new InputStreamReader(process.getInputStream()));
                      String line;
                      while ((line = r.readLine()) != null) Log.i(TAG, line);
                      int result = process.waitFor();
                      Log.i(TAG, "exit=" + result);
                      return result;
                  } catch (Throwable t) {
                      Log.e(TAG, "copy failed", t);
                      return -1;
                  } finally {
                      if (process != null) process.destroy();
                  }
              }

              private static String quote(String s) { return "'" + s.replace("'", "'\\''") + "'"; }

              @Override public void destroy() {
                  Log.i(TAG, "destroy");
                  System.exit(0);
              }
          }
          EOF

      - name: Create FileManager
        shell: bash
        run: |
          cat > app/src/main/java/com/penix/proxy/FileManager.java <<'EOF'
          package com.penix.proxy;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.IBinder;
          import android.util.Log;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import rikka.shizuku.Shizuku;

          public final class FileManager {
              private static final String TAG = "PenixFileManager";
              private static final String GAME = "/storage/emulated/0/Android/data/com.dts.freefireth/files";

              public static boolean replaceGameFilesWithShizuku(Context context) {
                  File source = null;
                  try {
                      if (!Shizuku.pingBinder()) { Log.e(TAG, "Shizuku not running"); return false; }
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) { Log.e(TAG, "Shizuku permission missing"); return false; }

                      File base = context.getExternalFilesDir(null);
                      if (base == null) return false;
                      source = new File(base, "penix_files");
                      deleteLocal(source);
                      if (!source.mkdirs() && !source.isDirectory()) return false;
                      if (!copyAssetsFolder(context, "files", source)) { Log.e(TAG, "assets/files copy failed"); return false; }

                      final CountDownLatch latch = new CountDownLatch(1);
                      final IFileCopyService[] remote = new IFileCopyService[1];
                      final Shizuku.UserServiceArgs args = new Shizuku.UserServiceArgs(new ComponentName(context, FileCopyUserService.class))
                              .daemon(false).debuggable(true).version(1).tag("penix-file-copy").processNameSuffix("filecopy");
                      final ServiceConnection connection = new ServiceConnection() {
                          @Override public void onServiceConnected(ComponentName name, IBinder binder) {
                              remote[0] = IFileCopyService.Stub.asInterface(binder);
                              latch.countDown();
                          }
                          @Override public void onServiceDisconnected(ComponentName name) { Log.e(TAG, "UserService disconnected"); }
                      };

                      Shizuku.bindUserService(args, connection);
                      if (!latch.await(20, TimeUnit.SECONDS) || remote[0] == null) {
                          Log.e(TAG, "UserService timeout");
                          Shizuku.unbindUserService(args, connection, true);
                          return false;
                      }

                      int result = remote[0].copyFiles(source.getAbsolutePath(), GAME);
                      Shizuku.unbindUserService(args, connection, true);
                      if (result != 0) { Log.e(TAG, "copy exit=" + result); return false; }
                      boolean ok = new File(GAME).isDirectory();
                      Log.i(TAG, "replacement=" + ok);
                      return ok;
                  } catch (Throwable t) {
                      Log.e(TAG, "replacement failed", t);
                      return false;
                  }
              }

              private static boolean copyAssetsFolder(Context c, String path, File dst) throws IOException {
                  String[] list = c.getAssets().list(path);
                  if (list == null) return false;
                  for (String name : list) {
                      String full = path + "/" + name;
                      String[] children = c.getAssets().list(full);
                      File out = new File(dst, name);
                      if (children != null && children.length > 0) {
                          if (!out.exists() && !out.mkdirs()) return false;
                          if (!copyAssetsFolder(c, full, out)) return false;
                      } else {
                          File p = out.getParentFile();
                          if (p != null && !p.exists() && !p.mkdirs()) return false;
                          try (InputStream in = c.getAssets().open(full); FileOutputStream fos = new FileOutputStream(out)) {
                              byte[] b = new byte[8192]; int n;
                              while ((n = in.read(b)) != -1) fos.write(b, 0, n);
                          }
                      }
                  }
                  return true;
              }

              private static void deleteLocal(File f) {
                  if (!f.exists()) return;
                  if (f.isDirectory()) { File[] a = f.listFiles(); if (a != null) for (File x : a) deleteLocal(x); }
                  f.delete();
              }
          }
          EOF

      - name: Verify source before build
        run: |
          set -e
          ! grep -R 'newProcess(' app/src/main/java || true
          test -f app/src/main/java/com/penix/proxy/FileManager.java
          test -f app/src/main/java/com/penix/proxy/FileCopyUserService.java
          test -f app/src/main/java/com/penix/proxy/IFileCopyService.java
          grep -R 'rikka.shizuku.Shizuku' app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PENIX_PROXY_APK
          path: app/build/outputs/apk/debug/*.apk
