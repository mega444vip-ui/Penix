name: Build PENIX PROXY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. تحميل المستودع
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. فك PENIX_PROXY.zip
      # =========================================================
      - name: فك ضغط المشروع
        run: |
          unzip -q PENIX_PROXY.zip -d ./temp
          cp -r ./temp/PENIX_PROXY/. .

          echo "===== PROJECT FILES ====="
          find app/src/main -maxdepth 5 -type f | sort


      # =========================================================
      # 3. إصلاح Gradle
      # =========================================================
      - name: إصلاح Gradle و Namespace
        run: |

          sed -i '/android {/a\    namespace "com.penix.proxy"' app/build.gradle

          sed -i 's/minSdk[[:space:]]*[0-9]*/minSdk 24/' app/build.gradle

          echo "===== BUILD.GRADLE ====="
          cat app/build.gradle


      # =========================================================
      # 4. إصلاح imports الخاصة بـ Shizuku
      # =========================================================
      - name: إصلاح Shizuku imports
        run: |

          find app/src/main/java \
            -type f \
            -name "*.java" \
            -print0 |
          while IFS= read -r -d '' file; do

            sed -i \
              's/import moe\.shizuku\.Shizuku;/import rikka.shizuku.Shizuku;/' \
              "$file"

            sed -i \
              's/import moe\.shizuku\.ShizukuProvider;/import rikka.shizuku.ShizukuProvider;/' \
              "$file"

            sed -i \
              's/import moe\.shizuku\.ShizukuBinderWrapper;/import rikka.shizuku.ShizukuBinderWrapper;/' \
              "$file"

          done


      # =========================================================
      # 5. إنشاء layout إذا لم يكن موجودًا
      # =========================================================
      - name: إنشاء Activity Layout
        run: |

          mkdir -p app/src/main/res/layout

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF


      # =========================================================
      # 6. إنشاء مجلدات الأيقونة
      # =========================================================
      - name: تثبيت أيقونة التطبيق
        run: |

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-mdpi
          mkdir -p app/src/main/res/drawable-hdpi
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/src/main/res/drawable-xxhdpi
          mkdir -p app/src/main/res/drawable-xxxhdpi

          if [ ! -f "ic_launcher.png" ]; then
            echo "ERROR: ic_launcher.png غير موجود في جذر المشروع"
            exit 1
          fi

          cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-mdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-hdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-xhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-xxhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-xxxhdpi/ic_launcher.png


      # =========================================================
      # 7. تعديل Manifest
      # =========================================================
      - name: إصلاح AndroidManifest
        run: |

          sed -i 's/package="com\.penix\.proxy"//' \
            app/src/main/AndroidManifest.xml

          echo "===== MANIFEST ====="
          cat app/src/main/AndroidManifest.xml


      # =========================================================
      # 8. إنشاء FileManager جديد
      #
      # لا نستخدم:
      # Shizuku.newShell()
      #
      # ولا:
      # Shizuku.newProcess()
      #
      # لأنهما غير مناسبين لـ API 13.1.5.
      #
      # بدلًا من ذلك نستخدم UserService.
      # =========================================================
      - name: إنشاء FileManager
        run: |

          mkdir -p app/src/main/java/com/penix/proxy

          cat > app/src/main/java/com/penix/proxy/FileManager.java <<'EOF'
          package com.penix.proxy;

          import android.content.Context;
          import android.util.Log;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          import rikka.shizuku.Shizuku;

          public class FileManager {

              private static final String TAG = "FileManager";

              /*
               * مسار ملفات Free Fire
               */
              private static final String GAME_FILES_PATH =
                      "/storage/emulated/0/Android/data/com.dts.freefireth/files";

              private static final int SHIZUKU_PERMISSION_REQUEST = 1001;


              /*
               * يتم استدعاء هذه الدالة من MainActivity
               */
              public static boolean replaceGameFilesWithShizuku(Context context) {

                  try {

                      /*
                       * -------------------------------------------------
                       * 1. التأكد من أن Shizuku يعمل
                       * -------------------------------------------------
                       */

                      if (!Shizuku.pingBinder()) {

                          Log.e(TAG, "Shizuku غير مفعل");

                          return false;
                      }


                      /*
                       * -------------------------------------------------
                       * 2. التأكد من صلاحية Shizuku
                       * -------------------------------------------------
                       */

                      if (Shizuku.checkSelfPermission()
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {

                          Log.e(TAG, "صلاحية Shizuku غير ممنوحة");

                          return false;
                      }


                      /*
                       * -------------------------------------------------
                       * 3. تجهيز files من assets
                       * -------------------------------------------------
                       */

                      File tempRoot =
                              new File(context.getCacheDir(), "penix_files");

                      if (tempRoot.exists()) {
                          deleteLocal(tempRoot);
                      }

                      if (!tempRoot.mkdirs()) {

                          Log.e(TAG, "فشل إنشاء مجلد مؤقت");

                          return false;
                      }


                      boolean copied =
                              copyAssetsFolder(
                                      context,
                                      "files",
                                      tempRoot
                              );

                      if (!copied) {

                          Log.e(TAG, "فشل نسخ assets/files");

                          return false;
                      }


                      /*
                       * -------------------------------------------------
                       * 4. تشغيل عملية Shizuku
                       * -------------------------------------------------
                       *
                       * UserService هو الطريقة الصحيحة الحديثة.
                       */

                      FileManagerService.setPaths(
                              tempRoot.getAbsolutePath(),
                              GAME_FILES_PATH
                      );

                      FileManagerService.start();

                      /*
                       * نعطي العملية وقتًا للتنفيذ.
                       */
                      Thread.sleep(3000);


                      /*
                       * -------------------------------------------------
                       * 5. التحقق
                       * -------------------------------------------------
                       */

                      File gameFiles =
                              new File(GAME_FILES_PATH);

                      if (gameFiles.exists()) {

                          Log.d(
                                  TAG,
                                  "تم تنفيذ عملية الملفات"
                          );

                          return true;
                      }


                      Log.e(
                              TAG,
                              "مجلد اللعبة غير موجود بعد العملية"
                      );

                      return false;

                  } catch (Exception e) {

                      Log.e(
                              TAG,
                              "فشل استبدال الملفات",
                              e
                      );

                      return false;
                  }
              }


              /*
               * نسخ assets/files إلى cache
               */
              private static boolean copyAssetsFolder(
                      Context context,
                      String assetPath,
                      File dest
              ) throws IOException {

                  String[] files =
                          context.getAssets().list(assetPath);

                  if (files == null) {
                      return false;
                  }

                  if (!dest.exists()) {
                      dest.mkdirs();
                  }


                  for (String name : files) {

                      String fullPath =
                              assetPath + "/" + name;

                      String[] children =
                              context.getAssets().list(fullPath);


                      if (children != null && children.length > 0) {

                          File directory =
                                  new File(dest, name);

                          if (!directory.exists()) {
                              directory.mkdirs();
                          }

                          if (!copyAssetsFolder(
                                  context,
                                  fullPath,
                                  directory
                          )) {

                              return false;
                          }

                      } else {

                          InputStream input =
                                  context.getAssets().open(fullPath);

                          File outputFile =
                                  new File(dest, name);

                          File parent =
                                  outputFile.getParentFile();

                          if (parent != null) {
                              parent.mkdirs();
                          }

                          FileOutputStream output =
                                  new FileOutputStream(outputFile);

                          byte[] buffer =
                                  new byte[8192];

                          int count;

                          while ((count =
                                  input.read(buffer)) != -1) {

                              output.write(
                                      buffer,
                                      0,
                                      count
                              );
                          }

                          output.flush();

                          output.close();
                          input.close();
                      }
                  }

                  return true;
              }


              /*
               * حذف الملفات المؤقتة فقط.
               */
              private static void deleteLocal(File file) {

                  if (file.isDirectory()) {

                      File[] children =
                              file.listFiles();

                      if (children != null) {

                          for (File child : children) {
                              deleteLocal(child);
                          }
                      }
                  }

                  file.delete();
              }
          }
          EOF


      # =========================================================
      # 9. إنشاء UserService
      # =========================================================
      - name: إنشاء FileManagerService
        run: |

          cat > app/src/main/java/com/penix/proxy/FileManagerService.java <<'EOF'
          package com.penix.proxy;

          import android.os.IBinder;
          import android.util.Log;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          import rikka.shizuku.Shizuku;
          import rikka.shizuku.Shizuku.UserServiceArgs;

          public class FileManagerService {

              private static final String TAG =
                      "FileManagerService";

              private static String SOURCE;
              private static String DESTINATION;


              public static void setPaths(
                      String source,
                      String destination
              ) {

                  SOURCE = source;
                  DESTINATION = destination;
              }


              public static void start() {

                  if (!Shizuku.pingBinder()) {

                      Log.e(
                              TAG,
                              "Shizuku غير متصل"
                      );

                      return;
                  }


                  UserServiceArgs args =
                          new UserServiceArgs(
                                  new android.content.ComponentName(
                                          "com.penix.proxy",
                                          FileCopyUserService.class.getName()
                                  )
                          )
                          .daemon(false)
                          .debuggable(true)
                          .version(1)
                          .processNameSuffix("filecopy");


                  Shizuku.bindUserService(
                          args,
                          new android.content.ServiceConnection() {

                              @Override
                              public void onServiceConnected(
                                      android.content.ComponentName name,
                                      IBinder service
                              ) {

                                  Log.d(
                                          TAG,
                                          "UserService connected"
                                  );

                                  FileCopyUserService.execute(
                                          service,
                                          SOURCE,
                                          DESTINATION
                                  );
                              }


                              @Override
                              public void onServiceDisconnected(
                                      android.content.ComponentName name
                              ) {

                                  Log.d(
                                          TAG,
                                          "UserService disconnected"
                                  );
                              }
                          }
                  );
              }
          }
          EOF


      # =========================================================
      # 10. إنشاء خدمة نسخ الملفات
      # =========================================================
      - name: إنشاء FileCopyUserService
        run: |

          cat > app/src/main/java/com/penix/proxy/FileCopyUserService.java <<'EOF'
          package com.penix.proxy;

          import android.os.Binder;
          import android.os.IBinder;
          import android.util.Log;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class FileCopyUserService {

              private static final String TAG =
                      "FileCopyUserService";


              public static void main(String[] args) {

                  /*
                   * UserService يعمل بصلاحيات Shizuku.
                   *
                   * لا نستخدم newProcess().
                   */

                  Log.d(
                          TAG,
                          "FileCopyUserService started"
                  );
              }


              public static void execute(
                      IBinder binder,
                      String source,
                      String destination
              ) {

                  new Thread(() -> {

                      try {

                          /*
                           * نحذف files القديم ثم ننسخ
                           * الملفات الجديدة.
                           */

                          String command =
                                  "rm -rf '" +
                                  destination +
                                  "' && " +

                                  "mkdir -p '" +
                                  destination +
                                  "' && " +

                                  "cp -r '" +
                                  source +
                                  "/.' '" +
                                  destination +
                                  "/'";


                          Log.d(
                                  TAG,
                                  "Executing: " + command
                          );


                          Process process =
                                  Runtime.getRuntime().exec(
                                          new String[]{
                                                  "sh",
                                                  "-c",
                                                  command
                                          }
                                  );


                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  process.getInputStream()
                                          )
                                  );


                          String line;

                          while ((line =
                                  reader.readLine()) != null) {

                              Log.d(
                                      TAG,
                                      line
                              );
                          }


                          int result =
                                  process.waitFor();


                          Log.d(
                                  TAG,
                                  "Result = " + result
                          );


                      } catch (Exception e) {

                          Log.e(
                                  TAG,
                                  "File copy failed",
                                  e
                          );
                      }

                  }).start();
              }
          }
          EOF


      # =========================================================
      # 11. إعداد JDK
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # =========================================================
      # 12. Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'


      # =========================================================
      # 13. gradle.properties
      # =========================================================
      - name: إصلاح compileSdk warning
        run: |

          touch gradle.properties

          if ! grep -q \
            "android.suppressUnsupportedCompileSdk" \
            gradle.properties; then

            echo \
            "android.suppressUnsupportedCompileSdk=34" \
            >> gradle.properties

          fi


      # =========================================================
      # 14. Build
      # =========================================================
      - name: Build APK
        run: |

          gradle assembleDebug --stacktrace


      # =========================================================
      # 15. رفع APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PENIX_PROXY_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
