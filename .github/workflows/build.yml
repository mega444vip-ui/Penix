name: Build PENIX PROXY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          unzip -q PENIX_PROXY.zip -d ./temp
          cp -r ./temp/PENIX_PROXY/. .
          echo "===== PROJECT ====="
          find app/src/main -maxdepth 4 -type f | sort

      - name: إصلاح المشروع
        run: |
          echo "===== BUILD.GRADLE ====="

          sed -i '/android {/a\    namespace "com.penix.proxy"' app/build.gradle
          sed -i 's/minSdk[[:space:]]*[0-9]*/minSdk 24/' app/build.gradle

          cat app/build.gradle

          echo "===== SHIZUKU IMPORTS ====="

          find app/src/main/java -type f -name "*.java" -print0 | while IFS= read -r -d '' file; do
            sed -i 's/import moe\.shizuku\.Shizuku;/import rikka.shizuku.Shizuku;/' "$file"
            sed -i 's/import moe\.shizuku\.ShizukuProvider;/import rikka.shizuku.ShizukuProvider;/' "$file"
            sed -i 's/import moe\.shizuku\.ShizukuBinderWrapper;/import rikka.shizuku.ShizukuBinderWrapper;/' "$file"
          done

          echo "===== ACTIVITY MAIN ====="

          mkdir -p app/src/main/res/layout

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          echo "===== MANIFEST ====="

          sed -i 's/package="com\.penix\.proxy"//' \
            app/src/main/AndroidManifest.xml

          echo "===== ICON DIRECTORIES ====="

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-mdpi
          mkdir -p app/src/main/res/drawable-hdpi
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/src/main/res/drawable-xxhdpi
          mkdir -p app/src/main/res/drawable-xxxhdpi

          if [ ! -f "ic_launcher.png" ]; then
            echo "ERROR: ic_launcher.png غير موجود في جذر المشروع"
            exit 1
          fi

          cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-mdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-hdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-xhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-xxhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/drawable-xxxhdpi/ic_launcher.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: تنزيل dependencies
        run: |
          gradle dependencies --configuration debugCompileClasspath

      - name: فحص Shizuku API
        run: |
          echo "======================================"
          echo "       SHIZUKU API INSPECTION"
          echo "======================================"

          find ~/.gradle/caches \
            -type f \
            \( -name "*.jar" -o -name "*.aar" \) \
            2>/dev/null \
            | grep -i shizuku \
            | head -100

          echo "===== CLASSES ====="

          find ~/.gradle/caches \
            -type f \
            -name "*.jar" \
            2>/dev/null \
            | while read jar; do

              if unzip -l "$jar" 2>/dev/null \
                | grep -q "rikka/shizuku/Shizuku.class"; then

                echo ""
                echo "FOUND SHIZUKU:"
                echo "$jar"
                echo ""

                unzip -l "$jar" \
                  | grep "rikka/shizuku/" \
                  | head -200

              fi

          done

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PENIX_PROXY_APK
          path: app/build/outputs/apk/debug/*.apk
