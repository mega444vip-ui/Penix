name: Build PENIX PROXY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          unzip -q PENIX_PROXY.zip -d ./temp
          cp -r ./temp/PENIX_PROXY/. .
          ls -la

      - name: إصلاح ملفات المشروع
        run: |
          echo "===== إصلاح build.gradle ====="

          sed -i '/android {/a\    namespace "com.penix.proxy"' app/build.gradle
          sed -i 's/minSdk[[:space:]]*[0-9]*/minSdk 24/' app/build.gradle

          echo "===== إنشاء activity_main.xml ====="

          mkdir -p app/src/main/res/layout

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

          echo "===== إصلاح AndroidManifest.xml ====="

          sed -i 's/package="com\.penix\.proxy"//' app/src/main/AndroidManifest.xml

          echo "===== activity_main.xml ====="
          cat app/src/main/res/layout/activity_main.xml

          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo "===== AndroidManifest.xml ====="
          cat app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PENIX_PROXY_APK
          path: app/build/outputs/apk/debug/*.apk
