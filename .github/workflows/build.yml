name: Build PENIX PROXY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf temp
          unzip -q PENIX_PROXY.zip -d temp
          cp -a temp/PENIX_PROXY/. .

      - name: Prepare project
        shell: bash
        run: |
          set -e

          # Android Gradle Plugin namespace/minSdk.
          sed -i '/android {/a\    namespace "com.penix.proxy"' app/build.gradle
          sed -i 's/minSdk[[:space:]]*[0-9]*/minSdk 24/' app/build.gradle

          # Use the Shizuku package names used by API 13.x.
          sed -i 's/import moe\.shizuku\.Shizuku;/import rikka.shizuku.Shizuku;/' $(find app/src/main/java -type f -name '*.java') 2>/dev/null || true
          sed -i 's/import moe\.shizuku\.ShizukuProvider;/import rikka.shizuku.ShizukuProvider;/' $(find app/src/main/java -type f -name '*.java') 2>/dev/null || true
          sed -i 's/import moe\.shizuku\.ShizukuBinderWrapper;/import rikka.shizuku.ShizukuBinderWrapper;/' $(find app/src/main/java -type f -name '*.java') 2>/dev/null || true

          # Make sure Shizuku API/provider are present exactly once.
          sed -i '/dev\.rikka\.shizuku:api:/d' app/build.gradle
          sed -i '/dev\.rikka\.shizuku:provider:/d' app/build.gradle
          sed -i '/dependencies {/a\    implementation "dev.rikka.shizuku:api:13.1.5"\n    implementation "dev.rikka.shizuku:provider:13.1.5"' app/build.gradle

          # Manifest: namespace is supplied by Gradle; keep the Shizuku provider.
          sed -i 's/package="com\.penix\.proxy"//' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:icon="@drawable\/ic_launcher"/android:icon="@drawable\/ic_launcher"/' app/src/main/AndroidManifest.xml || true

          # WebView layout used by the original activity.
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          # Put the supplied icon in all drawable density folders.
          test -f ic_launcher.png
          for d in drawable drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            mkdir -p "app/src/main/res/$d"
            cp -f ic_launcher.png "app/src/main/res/$d/ic_launcher.png"
          done

      - name: Replace old file-copy implementation
        shell: bash
        run: |
          set -e
          rm -f app/src/main/java/com/penix/proxy/FileManager.java
          rm -f app/src/main/java/com/penix/proxy/FileCopyUserService.java
          rm -f app/src/main/java/com/penix/proxy/IFileCopyService.java

          cat > app/src/main/java/com/penix/proxy/IFileCopyService.java <<'EOF'
          package com.penix.proxy;

          import android.os.Binder;
          import android.os.IBinder;
          import android.os.IInterface;
          import android.os.Parcel;
          import android.os.ParcelFileDescriptor;
          import android.os.RemoteException;

          public interface IFileCopyService extends IInterface {
              int replaceTree(String source, String destination) throws RemoteException;

              abstract class Stub extends Binder implements IFileCopyService {
                  private static final String DESCRIPTOR = "com.penix.proxy.IFileCopyService";
                  private static final int TRANSACTION_REPLACE = IBinder.FIRST_CALL_TRANSACTION;
                  private static final int DESTROY_AIDL = 16777114;
                  private static final int DESTROY = 16777115;

                  public Stub() {
                      attachInterface(this, DESCRIPTOR);
                  }

                  public static IFileCopyService asInterface(IBinder binder) {
                      if (binder == null) return null;
                      IInterface local = binder.queryLocalInterface(DESCRIPTOR);
                      if (local instanceof IFileCopyService) return (IFileCopyService) local;
                      return new Proxy(binder);
                  }

                  @Override
                  public IBinder asBinder() {
                      return this;
                  }

                  @Override
                  protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) throws RemoteException {
                      if (code == INTERFACE_TRANSACTION) {
                          reply.writeString(DESCRIPTOR);
                          return true;
                      }
                      if (code == DESTROY_AIDL || code == DESTROY) {
                          destroy();
                          return true;
                      }
                      if (code == TRANSACTION_REPLACE) {
                          data.enforceInterface(DESCRIPTOR);
                          String source = data.readString();
                          String destination = data.readString();
                          int result = replaceTree(source, destination);
                          reply.writeNoException();
                          reply.writeInt(result);
                          return true;
                      }
                      return super.onTransact(code, data, reply, flags);
                  }

                  private static final class Proxy implements IFileCopyService {
                      private final IBinder remote;

                      Proxy(IBinder remote) {
                          this.remote = remote;
                      }

                      @Override
                      public IBinder asBinder() {
                          return remote;
                      }

                      @Override
                      public int replaceTree(String source, String destination) throws RemoteException {
                          Parcel data = Parcel.obtain();
                          Parcel reply = Parcel.obtain();
                          try {
                              data.writeInterfaceToken(DESCRIPTOR);
                              data.writeString(source);
                              data.writeString(destination);
                              remote.transact(TRANSACTION_REPLACE, data, reply, 0);
                              reply.readException();
                              return reply.readInt();
                          } finally {
                              reply.recycle();
                              data.recycle();
                          }
                      }
                  }
              }

              default void destroy() throws RemoteException {
              }
          }
          EOF

          cat > app/src/main/java/com/penix/proxy/FileCopyUserService.java <<'EOF'
          package com.penix.proxy;

          import android.content.Context;
          import android.os.ParcelFileDescriptor;
          import android.os.RemoteException;
          import android.util.Log;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;

          /**
           * Runs inside Shizuku's UserService process. With ADB-backed Shizuku this is shell
           * UID 2000. File operations are performed here, not from the normal app process.
           */
          public class FileCopyUserService extends IFileCopyService.Stub {
              private static final String TAG = "PenixFileService";

              public FileCopyUserService() {
                  Log.i(TAG, "UserService started");
              }

              public FileCopyUserService(Context context) {
                  Log.i(TAG, "UserService started with context");
              }

              @Override
              public int replaceTree(String sourcePath, String destinationPath) throws RemoteException {
                  try {
                      File source = new File(sourcePath);
                      File destination = new File(destinationPath);

                      Log.i(TAG, "source=" + source.getAbsolutePath());
                      Log.i(TAG, "destination=" + destination.getAbsolutePath());

                      if (!source.isDirectory()) {
                          Log.e(TAG, "SOURCE_NOT_DIRECTORY");
                          return 10;
                      }

                      File parent = destination.getParentFile();
                      if (parent != null && !parent.exists() && !parent.mkdirs() && !parent.isDirectory()) {
                          Log.e(TAG, "DEST_PARENT_CREATE_FAILED");
                          return 11;
                      }

                      // Keep the files directory itself and replace its contents. This avoids
                      // an unnecessary delete/create of the package's files directory.
                      if (destination.exists() && !destination.isDirectory()) {
                          if (!deleteTree(destination)) {
                              Log.e(TAG, "DEST_FILE_DELETE_FAILED");
                              return 12;
                          }
                      }

                      if (!destination.exists() && !destination.mkdirs() && !destination.isDirectory()) {
                          Log.e(TAG, "DEST_CREATE_FAILED");
                          return 13;
                      }

                      File[] oldFiles = destination.listFiles();
                      if (oldFiles == null && destination.exists()) {
                          Log.e(TAG, "DEST_LIST_FAILED");
                          return 14;
                      }
                      if (oldFiles != null) {
                          for (File old : oldFiles) {
                              if (!deleteTree(old)) {
                                  Log.e(TAG, "DELETE_FAILED=" + old.getAbsolutePath());
                                  return 15;
                              }
                          }
                      }

                      File[] sourceFiles = source.listFiles();
                      if (sourceFiles == null) {
                          Log.e(TAG, "SOURCE_LIST_FAILED");
                          return 16;
                      }

                      for (File child : sourceFiles) {
                          File target = new File(destination, child.getName());
                          if (!copyTree(child, target)) {
                              Log.e(TAG, "COPY_FAILED=" + child.getAbsolutePath());
                              return 17;
                          }
                      }

                      // Verify that the destination can be listed after the operation.
                      if (!destination.isDirectory() || destination.listFiles() == null) {
                          Log.e(TAG, "VERIFY_FAILED");
                          return 18;
                      }

                      Log.i(TAG, "COPY_SUCCESS");
                      return 0;
                  } catch (Throwable e) {
                      Log.e(TAG, "REPLACE_EXCEPTION", e);
                      return 99;
                  }
              }

              private static boolean copyTree(File source, File target) throws IOException {
                  if (source.isDirectory()) {
                      if (!target.exists() && !target.mkdirs() && !target.isDirectory()) return false;
                      File[] children = source.listFiles();
                      if (children == null) return false;
                      for (File child : children) {
                          if (!copyTree(child, new File(target, child.getName()))) return false;
                      }
                      return true;
                  }

                  File parent = target.getParentFile();
                  if (parent != null && !parent.exists() && !parent.mkdirs() && !parent.isDirectory()) return false;

                  try (FileInputStream in = new FileInputStream(source);
                       FileOutputStream out = new FileOutputStream(target, false)) {
                      byte[] buffer = new byte[1024 * 1024];
                      int read;
                      while ((read = in.read(buffer)) != -1) out.write(buffer, 0, read);
                      out.getFD().sync();
                  }
                  return true;
              }

              private static boolean deleteTree(File file) {
                  if (!file.exists()) return true;
                  if (file.isDirectory()) {
                      File[] children = file.listFiles();
                      if (children == null) return false;
                      for (File child : children) {
                          if (!deleteTree(child)) return false;
                      }
                  }
                  return file.delete() || !file.exists();
              }

              /** Direct FD helper, following the same UserService pattern used by modern Shizuku file managers. */
              public static ParcelFileDescriptor openFile(String path, int mode) throws IOException {
                  try {
                      return ParcelFileDescriptor.open(new File(path), mode);
                  } catch (Exception e) {
                      throw new IOException("Cannot open " + path + ": " + e.getMessage(), e);
                  }
              }

              @Override
              public void destroy() {
                  Log.i(TAG, "UserService destroyed");
                  System.exit(0);
              }
          }
          EOF

          cat > app/src/main/java/com/penix/proxy/FileManager.java <<'EOF'
          package com.penix.proxy;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.os.IBinder;
          import android.util.Log;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;

          import rikka.shizuku.Shizuku;

          public final class FileManager {
              private static final String TAG = "PenixFileManager";
              private static final String GAME_FILES = "/storage/emulated/0/Android/data/com.dts.freefireth/files";
              private static final int REQUEST_CODE = 9001;

              private FileManager() {}

              public static boolean replaceGameFilesWithShizuku(Context context) {
                  File source = null;
                  try {
                      if (!Shizuku.pingBinder()) {
                          Log.e(TAG, "FAIL: Shizuku is not running");
                          return false;
                      }

                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Log.e(TAG, "FAIL: Shizuku permission is not granted");
                          return false;
                      }

                      // Extract assets/files to this app's shared external files area. The
                      // privileged UserService can read it as shell UID, unlike app-private cache.
                      File root = context.getExternalFilesDir(null);
                      if (root == null) {
                          Log.e(TAG, "FAIL: external files directory unavailable");
                          return false;
                      }

                      source = new File(root, "penix_files_source");
                      deleteLocal(source);
                      if (!source.mkdirs() && !source.isDirectory()) {
                          Log.e(TAG, "FAIL: cannot create source directory");
                          return false;
                      }

                      if (!copyAssetsFolder(context, "files", source)) {
                          Log.e(TAG, "FAIL: assets/files could not be extracted");
                          return false;
                      }

                      final CountDownLatch connected = new CountDownLatch(1);
                      final IFileCopyService[] serviceHolder = new IFileCopyService[1];

                      final ServiceConnection connection = new ServiceConnection() {
                          @Override
                          public void onServiceConnected(ComponentName name, IBinder binder) {
                              Log.i(TAG, "UserService connected");
                              serviceHolder[0] = IFileCopyService.Stub.asInterface(binder);
                              connected.countDown();
                          }

                          @Override
                          public void onServiceDisconnected(ComponentName name) {
                              Log.e(TAG, "UserService disconnected");
                          }

                          @Override
                          public void onBindingDied(ComponentName name) {
                              Log.e(TAG, "UserService binding died");
                              connected.countDown();
                          }

                          @Override
                          public void onNullBinding(ComponentName name) {
                              Log.e(TAG, "UserService returned null binding");
                              connected.countDown();
                          }
                      };

                      Shizuku.UserServiceArgs args = new Shizuku.UserServiceArgs(
                              new ComponentName(context.getPackageName(), FileCopyUserService.class.getName()))
                              .daemon(false)
                              .debuggable(true)
                              .version(1)
                              .tag("penix-file-copy")
                              .processNameSuffix("filecopy");

                      Log.i(TAG, "Binding UserService...");
                      Shizuku.bindUserService(args, connection);

                      if (!connected.await(20, TimeUnit.SECONDS) || serviceHolder[0] == null) {
                          Log.e(TAG, "FAIL: UserService connection timeout");
                          Shizuku.unbindUserService(args, connection, true);
                          return false;
                      }

                      int result = serviceHolder[0].replaceTree(source.getAbsolutePath(), GAME_FILES);
                      Log.i(TAG, "UserService result=" + result);

                      Shizuku.unbindUserService(args, connection, true);

                      if (result != 0) {
                          Log.e(TAG, "FAIL: replacement result=" + result);
                          return false;
                      }

                      File destination = new File(GAME_FILES);
                      boolean success = destination.isDirectory();
                      Log.i(TAG, success ? "SUCCESS: files replaced" : "FAIL: destination verification failed");
                      return success;

                  } catch (Throwable e) {
                      Log.e(TAG, "FAIL: replacement exception", e);
                      return false;
                  }
              }

              private static boolean copyAssetsFolder(Context context, String assetPath, File destination) throws IOException {
                  String[] children = context.getAssets().list(assetPath);
                  if (children == null) return false;

                  for (String name : children) {
                      String childPath = assetPath + "/" + name;
                      File out = new File(destination, name);
                      String[] nested = context.getAssets().list(childPath);

                      if (nested != null && nested.length > 0) {
                          if (!out.exists() && !out.mkdirs() && !out.isDirectory()) return false;
                          if (!copyAssetsFolder(context, childPath, out)) return false;
                      } else {
                          File parent = out.getParentFile();
                          if (parent != null && !parent.exists() && !parent.mkdirs() && !parent.isDirectory()) return false;
                          try (InputStream in = context.getAssets().open(childPath);
                               FileOutputStream fos = new FileOutputStream(out, false)) {
                              byte[] buffer = new byte[8192];
                              int read;
                              while ((read = in.read(buffer)) != -1) fos.write(buffer, 0, read);
                          }
                      }
                  }
                  return true;
              }

              private static void deleteLocal(File file) {
                  if (!file.exists()) return;
                  if (file.isDirectory()) {
                      File[] children = file.listFiles();
                      if (children != null) for (File child : children) deleteLocal(child);
                  }
                  file.delete();
              }
          }
          EOF

      - name: Ensure manifest and permissions
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace(' package="com.penix.proxy"', '')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          if 'moe.shizuku.manager.permission.API_V23' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />\n\n</manifest>')
          p.write_text(s)
          PY

      - name: Verify project
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/penix/proxy/FileManager.java
          test -f app/src/main/java/com/penix/proxy/FileCopyUserService.java
          test -f app/src/main/java/com/penix/proxy/IFileCopyService.java
          test -f app/src/main/res/drawable/ic_launcher.png
          grep -R "newShell\|newProcess" app/src/main/java && exit 1 || true
          grep -R "com.dts.freefireth/files" app/src/main/java/com/penix/proxy/FileManager.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle clean assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PENIX_PROXY_APK
          path: app/build/outputs/apk/debug/*.apk
