name: Build PENIX PROXY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          unzip -q PENIX_PROXY.zip -d ./temp
          cp -r ./temp/PENIX_PROXY/. .
          ls -la

      - name: إصلاح namespace
        run: |
          sed -i '/android {/a\    namespace "com.penix.proxy"' app/build.gradle
          cat app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PENIX_PROXY_APK
          path: app/build/outputs/apk/debug/*.apk
